[project]
name = "knowledge-server"
version = "0.1.0"
description = "A harness-agnostic semantic knowledge server exposing a governed Markdown vault over MCP."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=1.27,<2",
    "numpy>=2.5.1",
    "pyjwt>=2.13.0",
    "pyyaml>=6.0.3",
]
